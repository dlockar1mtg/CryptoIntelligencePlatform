platform:
  name: Crypto Intelligence Platform
  version: 13.0.0
  database_path: data/crypto_intelligence.duckdb
  export_directory: data/exports
  cache_directory: data/cache
  log_directory: logs
collection:
  request_connect_timeout_seconds: 10
  request_read_timeout_seconds: 60
  max_retries: 5
  backoff_seconds: 2
  cache_ttl_minutes: 30
  incremental_overlap_days: 5
  default_start_date: '2017-01-01'
  exchange_start_date: '2020-01-01'
  coingecko_history_days: 365
  exchange_interval: 1d
  provider_failure_threshold: 2
providers:
  market:
    enabled: true
    primary: coingecko
  exchange_ohlcv:
    enabled: true
    priority:
    - coinbase
    - kraken
    - binance
    enabled_providers:
      coinbase: true
      kraken: true
      binance: false
  stablecoins:
    enabled: true
    primary: defillama
  chains:
    enabled: true
    primary: defillama
  macro:
    enabled: true
    priority:
    - fred_api
    - local_crypto_cache
quality:
  max_price_deviation_pct: 5.0
  daily_freshness_hours: 48
  macro_freshness_days: 45
macro_series:
- series_key: FRED::DFF
  series_id: DFF
  series_name: Effective Federal Funds Rate
  frequency: daily
  unit: percent
- series_key: FRED::DGS10
  series_id: DGS10
  series_name: 10-Year Treasury Yield
  frequency: daily
  unit: percent
- series_key: FRED::DFII10
  series_id: DFII10
  series_name: 10-Year Real Yield
  frequency: daily
  unit: percent
- series_key: FRED::T10YIE
  series_id: T10YIE
  series_name: 10-Year Breakeven Inflation
  frequency: daily
  unit: percent
- series_key: FRED::M2SL
  series_id: M2SL
  series_name: M2 Money Supply
  frequency: monthly
  unit: billions_usd
- series_key: FRED::DTWEXBGS
  series_id: DTWEXBGS
  series_name: Trade Weighted U.S. Dollar Index
  frequency: daily
  unit: index
- series_key: FRED::VIXCLS
  series_id: VIXCLS
  series_name: CBOE Volatility Index
  frequency: daily
  unit: index
- series_key: FRED::BAMLH0A0HYM2
  series_id: BAMLH0A0HYM2
  series_name: ICE BofA U.S. High Yield OAS
  frequency: daily
  unit: percent
- series_key: FRED::UNRATE
  series_id: UNRATE
  series_name: Unemployment Rate
  frequency: monthly
  unit: percent
