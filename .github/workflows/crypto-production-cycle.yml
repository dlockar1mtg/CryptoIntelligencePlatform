name: Crypto Production Cycle

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Run full provider refresh"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 11 * * 1-6"
    - cron: "15 14 * * *" # backup: skipped unless the last run that did the work is over 12 hours old (see the gate job)
    - cron: "15 17 * * *"
    - cron: "15 20 * * *"
    - cron: "45 10 * * 0"

permissions:
  contents: read

concurrency:
  group: crypto-production-cycle
  cancel-in-progress: false

jobs:
  gate:
    # GitHub often starts scheduled runs hours late or skips them, so this workflow also has
    # backup schedule times. A scheduled run goes ahead only if no run of this workflow finished
    # its work successfully in the last 12 hours. Manual runs and the Sunday full refresh always go ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          ALWAYS_RUN_SCHEDULES: "45 10 * * 0"
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ -n "$ALWAYS_RUN_SCHEDULES" ] && [[ "|$ALWAYS_RUN_SCHEDULES|" == *"|$SCHEDULE|"* ]]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf="${GITHUB_WORKFLOW_REF%@*}"; wf="${wf##*/}"
          since="$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=main&status=success&per_page=30" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | select(.event == \"schedule\" or .event == \"workflow_dispatch\") | select(.run_started_at >= \"$since\") | .id")"
          for id in $ids; do
            worked="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name != "gate" and .conclusion == "success")] | length')"
            if [ "$worked" -gt 0 ]; then
              echo "Run $id already did this workflow's work since $since, so this backup run stops here."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

  crypto-cycle:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }} # a failed gate never blocks the run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: staging
    env:
      CRYPTO_DATABASE_PATH: data/crypto_intelligence.duckdb
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CRYPTO_PRODUCTION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      CRYPTO_FULL_REFRESH_REQUESTED: ${{ (github.event_name == 'schedule' && github.event.schedule == '45 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full_refresh == true) }}
      CRYPTO_SKIP_COINGECKO_REQUESTED: ${{ (github.event_name == 'schedule' && github.event.schedule == '45 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full_refresh == true) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Restore hosted Crypto database
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/crypto_intelligence.duckdb
          key: crypto-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crypto-db-${{ runner.os }}-

      - name: Validate registry and workflow
        run: python scripts/check_crypto_production_readiness.py --strict

      - name: Classify refresh mode
        shell: bash
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "full_refresh=${CRYPTO_FULL_REFRESH_REQUESTED}"
          echo "skip_coingecko=${CRYPTO_SKIP_COINGECKO_REQUESTED}"

      - name: Run production pipeline
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [[ "$CRYPTO_FULL_REFRESH_REQUESTED" == "true" ]]; then
            EXTRA_ARGS="--full-refresh"
          fi
          if [[ "$CRYPTO_SKIP_COINGECKO_REQUESTED" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --skip-coingecko"
          fi
          python scripts/run_crypto_production_pipeline.py $EXTRA_ARGS

      - name: Resolve production run summary
        id: production
        shell: bash
        run: |
          SUMMARY="data/operations/crypto/production_runs/${CRYPTO_PRODUCTION_RUN_ID}/run_summary.json"
          test -f "$SUMMARY"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Certify hosted database health and freshness
        run: |
          python scripts/check_crypto_hosted_readiness.py \
            --database "$CRYPTO_DATABASE_PATH" \
            --output data/operations/crypto/hosted_readiness.json \
            --strict

      - name: Prepare UIP delivery artifact
        run: |
          python scripts/prepare_crypto_uip_delivery.py \
            --run-summary "${{ steps.production.outputs.summary }}" \
            --output-root data/operations/crypto/uip_delivery \
            --database "$CRYPTO_DATABASE_PATH"

      - name: Run production tests
        run: python -m pytest tests/production -q

      - name: Save hosted Crypto database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/crypto_intelligence.duckdb
          key: crypto-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Crypto production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/operations/crypto/production_runs/
            data/operations/crypto/hosted_readiness.json
            data/operations/crypto/uip_delivery/
          retention-days: 30
          if-no-files-found: warn
