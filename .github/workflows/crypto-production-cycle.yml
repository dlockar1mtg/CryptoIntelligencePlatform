name: Crypto Production Cycle

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Run full provider refresh"
        required: false
        default: false
        type: boolean
      all_modules:
        description: "Also run the research-only modules today (they normally run weekly, on the Sunday full refresh)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 11 * * 1-6"
    - cron: "15 17 * * *" # backup: skipped unless the last run that did the work is over 12 hours old (see the gate job). One backup only: each gate run bills a full minute.
    - cron: "45 10 * * 0"

permissions:
  contents: read

concurrency:
  group: crypto-production-cycle
  cancel-in-progress: false

jobs:
  gate:
    # GitHub often starts scheduled runs hours late or skips them, so this workflow also has
    # backup schedule times. A scheduled run goes ahead only if no run of this workflow finished
    # its work successfully in the last 12 hours. Manual runs and the Sunday full refresh always go ahead.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A failed gate is bookkeeping only: crypto-cycle still runs (see its `if`), and this keeps
    # the gate's failure from turning the whole run's conclusion into "failure".
    continue-on-error: true
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          ALWAYS_RUN_SCHEDULES: "45 10 * * 0"
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || { [ -n "$ALWAYS_RUN_SCHEDULES" ] && [[ "|$ALWAYS_RUN_SCHEDULES|" == *"|$SCHEDULE|"* ]]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          wf="${GITHUB_WORKFLOW_REF%@*}"; wf="${wf##*/}"
          since="$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.head_branch == \"main\" and .conclusion == \"success\") | select(.id != $GITHUB_RUN_ID) | select(.event == \"schedule\" or .event == \"workflow_dispatch\") | select(.run_started_at >= \"$since\") | .id")"
          for id in $ids; do
            worked="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name != "gate" and .conclusion == "success")] | length')"
            if [ "$worked" -gt 0 ]; then
              echo "Run $id already did this workflow's work since $since, so this backup run stops here."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"

  crypto-cycle:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }} # a failed gate never blocks the run
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: staging
    env:
      CRYPTO_DATABASE_PATH: data/crypto_intelligence.duckdb
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      CRYPTO_PRODUCTION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      CRYPTO_FULL_REFRESH_REQUESTED: ${{ (github.event_name == 'schedule' && github.event.schedule == '45 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full_refresh == true) }}
      CRYPTO_SKIP_COINGECKO_REQUESTED: ${{ (github.event_name == 'schedule' && github.event.schedule == '45 10 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.full_refresh == true) }}
      # Research-only modules (nothing the UIP delivery reads depends on them) run on the
      # Sunday full refresh, or when their last successful run is over 7 days old.
      CRYPTO_ALL_MODULES_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.all_modules == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Restore hosted Crypto database
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: data/crypto_intelligence.duckdb
          key: crypto-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crypto-db-${{ runner.os }}-

      - name: Validate registry and workflow
        run: python scripts/check_crypto_production_readiness.py --strict

      - name: Classify refresh mode
        shell: bash
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "full_refresh=${CRYPTO_FULL_REFRESH_REQUESTED}"
          echo "skip_coingecko=${CRYPTO_SKIP_COINGECKO_REQUESTED}"
          echo "all_modules=${CRYPTO_ALL_MODULES_REQUESTED}"

      - name: Run production pipeline
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [[ "$CRYPTO_FULL_REFRESH_REQUESTED" == "true" ]]; then
            EXTRA_ARGS="--full-refresh"
          fi
          if [[ "$CRYPTO_SKIP_COINGECKO_REQUESTED" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --skip-coingecko"
          fi
          if [[ "$CRYPTO_ALL_MODULES_REQUESTED" != "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --weekly-research"
          fi
          python scripts/run_crypto_production_pipeline.py $EXTRA_ARGS

      - name: Report the slowest modules
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path("data/operations/crypto/production_runs") / os.environ["CRYPTO_PRODUCTION_RUN_ID"] / "run_summary.json"
          if p.is_file():
              rows = sorted(json.loads(p.read_text()).get("module_results", []), key=lambda r: -float(r.get("duration_seconds") or 0))
              total = sum(float(r.get("duration_seconds") or 0) for r in rows)
              ran = [r for r in rows if r.get("status") != "SKIPPED_WEEKLY"]
              skipped = sorted(int(r["module"]) for r in rows if r.get("status") == "SKIPPED_WEEKLY")
              text = "%0A".join(f"module {r['module']}: {float(r.get('duration_seconds') or 0) / 60:.1f} min ({r['status']})" for r in ran[:12])
              if skipped:
                  text += "%0A" + f"skipped (weekly research): {', '.join(map(str, skipped))}"
              print(f"::notice title=Crypto module timings ({total / 60:.1f} min in modules)::{text}")
          PY

      - name: Resolve production run summary
        id: production
        shell: bash
        run: |
          SUMMARY="data/operations/crypto/production_runs/${CRYPTO_PRODUCTION_RUN_ID}/run_summary.json"
          test -f "$SUMMARY"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Certify hosted database health and freshness
        run: |
          python scripts/check_crypto_hosted_readiness.py \
            --database "$CRYPTO_DATABASE_PATH" \
            --output data/operations/crypto/hosted_readiness.json \
            --strict

      - name: Prepare UIP delivery artifact
        run: |
          python scripts/prepare_crypto_uip_delivery.py \
            --run-summary "${{ steps.production.outputs.summary }}" \
            --output-root data/operations/crypto/uip_delivery \
            --database "$CRYPTO_DATABASE_PATH"

      - name: Track forecasts (legacy log, scoring, 7-day context)
        continue-on-error: true # forecast tracking never blocks the production cycle
        timeout-minutes: 30
        run: |
          python scripts/track_crypto_forecasts.py \
            --database "$CRYPTO_DATABASE_PATH" \
            --log data/forecast_tracking/forecast_log.csv \
            --output-dir data/operations/crypto/forecast_tracking

      - name: Run production tests
        run: python -m pytest tests/production -q

      - name: Save hosted Crypto database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/crypto_intelligence.duckdb
          key: crypto-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Crypto production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/operations/crypto/production_runs/
            data/operations/crypto/hosted_readiness.json
            data/operations/crypto/uip_delivery/
            data/operations/crypto/forecast_tracking/
          retention-days: 30
          if-no-files-found: warn

  forecast-log:
    # Commits the extended forecast log so its history outlives the cached database and the
    # 30-day artifacts. Runs only after a successful cycle on main.
    # Bookkeeping only: if committing the log fails (for example a git pull/push race), the run's
    # conclusion stays "success" so the UIP still picks up this run's delivery artifact.
    needs: crypto-cycle
    if: ${{ needs.crypto-cycle.result == 'success' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: crypto-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence

      - name: Commit the forecast log
        shell: bash
        run: |
          set -euo pipefail
          src="$(find evidence -path '*forecast_tracking/forecast_log.csv' | head -n 1)"
          if [ -z "$src" ]; then echo "No forecast log in this run's evidence"; exit 0; fi
          mkdir -p data/forecast_tracking
          cp "$src" data/forecast_tracking/forecast_log.csv
          summary="$(dirname "$src")/forecast_tracking_summary.json"
          if [ -f "$summary" ]; then cp "$summary" data/forecast_tracking/forecast_tracking_summary.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_tracking
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Crypto forecast log $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
